[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hackerrank-agent-template"
version = "0.1.0"
description = "Plugin-first AI agent template for HackerRank Orchestrate"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["core*", "plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]