name: text-classification-bedrock
meta:
  description: Bedrock LLM perception, tuned for AWS Fargate (no mock fallback)
  offline: false
io:
  input:
    plugin: input.csv
    config:
      row_id_field: row_id
  output:
    plugin: output.csv
    config:
      columns: [row_id, decision]
stages:
  clean:
    mode: one
    plugins:
      - name: cleaning.normalize
        config:
          strip: true
  context:
    mode: one
    plugins:
      - name: context.session
        config: {}
  retrieve:
    mode: none
  extract:
    mode: one
    plugins:
      - name: features.text
        config:
          text_fields: [message]
      - name: features.risk
        config:
          text_fields: [message]
  perceive:
    mode: one
    plugins:
      - name: perception.bedrock
        config:
          text_fields: [message]
          model_id: ${AWS_BEDROCK_MODEL_ID}
          max_tokens: 128
  decide:
    mode: one
    plugins:
      - name: policy.cascade
        config:
          levels:
            - name: policy.safety
              config: {}
            - name: policy.domain
              config:
                rules_path: recipes/rules_triage.json
            - name: policy.fallback
              config:
                default_label: ESCALATE
  confidence:
    mode: one
    plugins:
      - name: confidence.band
        config: {}
  validate:
    mode: one
    plugins:
      - name: validation.output_contract
        config:
          allowed_labels: [RESPOND, ESCALATE, BLOCK]
  trace:
    mode: none
  output:
    mode: one
    plugins:
      - name: output.csv
        config:
          columns: [row_id, decision]
          encoding: utf-8
